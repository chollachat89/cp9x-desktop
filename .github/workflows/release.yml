name: Build & Release CP9X

on:
  push:
    tags:
      - 'v*'          # push tag เช่น v1.0.1 แล้วจะ build + ปล่อย release อัตโนมัติ
  workflow_dispatch:   # หรือกดรันเองจากหน้า Actions

permissions:
  contents: write      # จำเป็นสำหรับสร้าง GitHub Release

# กันไม่ให้ workflow รันซ้อนกันบน tag เดียวกัน (ต้นเหตุของ release ซ้ำ)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # กันเวอร์ชันเพี้ยน: tag ที่ push ขึ้นมา ต้องตรงกับ version ใน package.json เป๊ะ ๆ
      # (ถ้าไม่ตรง ตัวโปรแกรมที่ผู้ใช้ติดตั้งจะโชว์เวอร์ชันคนละอย่างกับที่เห็นบนหน้า GitHub Releases
      #  และระบบอัปเดตอัตโนมัติจะเทียบเวอร์ชันผิด จนบางเครื่องไม่ได้รับอัปเดตเลย)
      - name: ตรวจสอบว่า tag ตรงกับ version ใน package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag = $TAG_VERSION | package.json = $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::เวอร์ชันไม่ตรงกัน! tag คือ v$TAG_VERSION แต่ package.json คือ $PKG_VERSION"
            echo "::error::วิธีแก้: แก้ version ใน package.json ให้เป็น $TAG_VERSION แล้ว commit + push ใหม่ ก่อนสร้าง tag"
            exit 1
          fi

      # ใช้ npm ci ถ้ามี package-lock.json  ไม่มีก็ fallback เป็น npm install
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; \
          else npm install --no-audit --no-fund; fi

      # Build เฉยๆ ไม่ให้ electron-builder ยิง GitHub API เอง (--publish never)
      # เหตุผล: electron-builder เคยพัง 404 ตอนพยายามเช็ค release เดิมผ่าน releases.atom ของ GitHub
      # (เป็นปัญหารู้กันในชุมชน electron-builder) จึงแยกขั้นตอน publish ออกมาทำเองด้วย action
      # ที่เสถียรกว่าแทน (softprops/action-gh-release ด้านล่าง)
      - name: Build (ไม่ publish เอง)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts (สำรอง)
        uses: actions/upload-artifact@v4
        with:
          name: cp9x-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

      # สร้าง/อัปเดต GitHub Release ของ tag นี้ พร้อมแนบไฟล์ - action ตัวนี้จัดการ
      # "อัปเดตของเดิมถ้ามีอยู่แล้ว" ให้เองอย่างปลอดภัย ไม่ต้องลบ release เก่าทิ้งก่อนแบบที่เคยทำ
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
